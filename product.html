<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Forge Store | Product</title>
<link rel="stylesheet" href="css/style.css">
```

</head>

<body>

<header>

```
<h1>Forge Store</h1>

<nav>
    <a href="index.html">Home</a>
    <a href="products.html">Products</a>
    <a href="cart.html">Cart 🛒</a>
</nav>
```

</header>

<main class="container">

```
<a href="products.html" class="back">
    ← Back to Products
</a>

<div id="product">
    Loading product...
</div>
```

</main>

<footer>

```
<p>© 2026 Forge Store. All rights reserved.</p>
```

</footer>

<script>

const products = [

    {
        id: 1,
        name: "Classic Sneakers",
        price: 250,
        category: "Shoes",
        description: "Comfortable and stylish sneakers for everyday use.",
        image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: 2,
        name: "Stylish Wristwatch",
        price: 180,
        category: "Accessories",
        description: "A stylish wristwatch for everyday wear.",
        image: "https://images.unsplash.com/photo-1524805444758-089113d48a6d?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: 3,
        name: "Premium T-Shirt",
        price: 120,
        category: "Clothing",
        description: "A comfortable premium T-shirt.",
        image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: 4,
        name: "Leather Backpack",
        price: 220,
        category: "Bags",
        description: "A stylish backpack for your everyday essentials.",
        image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: 5,
        name: "Wireless Headphones",
        price: 350,
        category: "Electronics",
        description: "Modern wireless headphones.",
        image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=800&q=80"
    },

    {
        id: 6,
        name: "Classic Sunglasses",
        price: 150,
        category: "Accessories",
        description: "Classic sunglasses with a stylish design.",
        image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?auto=format&fit=crop&w=800&q=80"
    }

];


let quantity = 1;


// GET PRODUCT ID FROM URL

const urlParams = new URLSearchParams(window.location.search);

const productId = Number(urlParams.get("id"));

const product = products.find(function(item) {

    return item.id === productId;

});


// DISPLAY PRODUCT

const container = document.getElementById("product");


if (!product) {

    container.innerHTML = `

        <div class="not-found">

            <h2>Product Not Found</h2>

            <p>
                We couldn't find that product.
            </p>

            <a href="products.html">
                Back to Products
            </a>

        </div>

    `;

} else {

    container.innerHTML = `

        <div class="product">

            <div class="product-image">

                <img
                    src="${product.image}"
                    alt="${product.name}"
                >

            </div>


            <div class="product-info">

                <span class="category">
                    ${product.category}
                </span>

                <h2>
                    ${product.name}
                </h2>

                <p class="description">
                    ${product.description}
                </p>

                <div class="price">
                    GH₵${product.price.toFixed(2)}
                </div>


                <div class="quantity">

                    <button onclick="changeQuantity(-1)">
                        −
                    </button>

                    <span id="quantity">
                        1
                    </span>

                    <button onclick="changeQuantity(1)">
                        +
                    </button>

                </div>


                <button
                    class="add-cart"
                    onclick="addToCart()"
                >
                    Add to Cart 🛒
                </button>

            </div>

        </div>

    `;

}


// CHANGE QUANTITY

function changeQuantity(amount) {

    quantity += amount;

    if (quantity < 1) {

        quantity = 1;

    }

    document.getElementById("quantity").textContent = quantity;

}


// ADD TO CART

function addToCart() {

    if (!product) {

        return;

    }


    let cart = JSON.parse(
        localStorage.getItem("cart")
    ) || [];


    const existing = cart.find(function(item) {

        return item.id === product.id;

    });


    if (existing) {

        existing.quantity += quantity;

    } else {

        cart.push({

            id: product.id,

            name: product.name,

            price: product.price,

            category: product.category,

            image: product.image,

            quantity: quantity

        });

    }


    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );


    alert(
        product.name +
        " added to your cart!"
    );

}

</script>

</body>
</html>
