<title>Forge Store | Products</title>
<link rel="stylesheet" href="css/style.css">
<style>
    #products {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 22px;
    }
    .view-product {
        display: block;
        text-align: center;
        background: #14151A;
        color: white;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 10px;
        font-weight: 600;
        transition: background 0.15s ease;
    }
    .view-product:hover {
        background: #FF5A1F;
    }
</style>
