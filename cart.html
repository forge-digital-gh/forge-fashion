<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Your Cart | Forge Store</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        /* =========================
           CART PAGE
        ========================= */

        .cart-page {
            min-height: 100vh;
            background: #080808;
            padding: 100px 20px;
        }

        .cart-container {
            width: min(1100px, 100%);
            margin: auto;
        }

        .cart-heading {
            margin-bottom: 40px;
        }

        .cart-heading .label {
            color: #ff5a1f;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .cart-heading h1 {
            margin-top: 10px;
            font-size: clamp(42px, 6vw, 70px);
            letter-spacing: -3px;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
        }

        /* CART ITEMS */

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 20px;
            padding: 18px;
            background: #111;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 16px;
            animation: cartIn .4s ease;
        }

        @keyframes cartIn {

            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .cart-item-image {
            width: 90px;
            height: 90px;
            border-radius: 12px;
            background:
                radial-gradient(
                    circle,
                    rgba(255,90,31,.14),
                    transparent 65%
                ),
                #181818;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            flex-shrink: 0;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-info h3 {
            font-size: 17px;
            margin-bottom: 6px;
        }

        .cart-item-price {
            color: #ff5a1f;
            font-size: 14px;
            font-weight: 700;
        }

        /* QUANTITY */

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #191919;
            padding: 6px;
            border-radius: 10px;
        }

        .quantity-control button {
            width: 30px;
            height: 30px;
            border: 0;
            border-radius: 7px;
            background: #252525;
            color: white;
            cursor: pointer;
            transition: .2s;
        }

        .quantity-control button:hover {
            background: #ff5a1f;
        }

        .quantity-number {
            min-width: 20px;
            text-align: center;
            font-size: 13px;
            font-weight: 700;
        }

        .remove-btn {
            border: 0;
            background: transparent;
            color: #666;
            cursor: pointer;
            font-size: 18px;
            transition: .2s;
        }

        .remove-btn:hover {
            color: #ff5a1f;
            transform: scale(1.1);
        }

        /* SUMMARY */

        .cart-summary {
            height: fit-content;
            padding: 25px;
            background: #111;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 18px;
            position: sticky;
            top: 30px;
        }

        .cart-summary h2 {
            font-size: 22px;
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            color: #888;
            font-size: 14px;
        }

        .summary-row.total {
            margin-top: 12px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,.08);
            color: white;
            font-size: 19px;
            font-weight: 800;
        }

        .checkout-btn {
            display: block;
            width: 100%;
            margin-top: 22px;
            padding: 16px;
            border: 0;
            border-radius: 11px;
            background: #ff5a1f;
            color: white;
            text-align: center;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: .3s;
        }

        .checkout-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255,90,31,.25);
        }

        .continue-shopping {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #777;
            font-size: 12px;
        }

        .continue-shopping:hover {
            color: white;
        }

        /* EMPTY CART */

        .empty-cart {
            display: none;
            padding: 80px 20px;
            text-align: center;
            background: #111;
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 18px;
        }

        .empty-cart-icon {
            font-size: 65px;
            margin-bottom: 20px;
        }

        .empty-cart h2 {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .empty-cart p {
            color: #777;
            margin-bottom: 25px;
        }

        .shop-btn {
            display: inline-block;
            padding: 14px 22px;
            border-radius: 10px;
            background: #ff5a1f;
            color: white;
            font-size: 12px;
            font-weight: 800;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            .cart-layout {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: static;
            }

        }

        @media (max-width: 550px) {

            .cart-page {
                padding: 70px 15px;
            }

            .cart-item {
                flex-wrap: wrap;
            }

            .cart-item-info {
                min-width: calc(100% - 115px);
            }

            .quantity-control {
                margin-left: 110px;
            }

        }

    </style>

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="forge-header">

    <div class="forge-nav">

        <a href="index.html"
           class="forge-logo">

            FORGE<span>.</span>

        </a>

        <nav class="forge-links">

            <a href="index.html">
                Home
            </a>

            <a href="products.html">
                Shop
            </a>

            <a href="index.html#categories">
                Categories
            </a>

            <a href="index.html#about">
                About
            </a>

        </nav>

        <div class="forge-actions">

            <a href="products.html"
               class="icon-button">

                ←

            </a>

            <a href="cart.html"
               class="cart-icon">

                🛒

                <span id="header-cart-count">
                    0
                </span>

            </a>

        </div>

    </div>

</header>


<!-- ================= CART ================= -->

<main class="cart-page">

    <div class="cart-container">

        <div class="cart-heading">

            <span class="label">
                FORGE STORE
            </span>

            <h1>
                Your Cart.
            </h1>

        </div>


        <!-- EMPTY CART -->

        <div
            class="empty-cart"
            id="empty-cart">

            <div class="empty-cart-icon">
                🛒
            </div>

            <h2>
                Your cart is empty
            </h2>

            <p>
                Looks like you haven't added
                anything yet.
            </p>

            <a
                href="products.html"
                class="shop-btn">

                Start Shopping →

            </a>

        </div>


        <!-- CART CONTENT -->

        <div
            class="cart-layout"
            id="cart-layout">


            <!-- ITEMS -->

            <div
                class="cart-items"
                id="cart-items">
            </div>


            <!-- SUMMARY -->

            <aside class="cart-summary">

                <h2>
                    Order Summary
                </h2>

                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <strong id="subtotal">
                        GH₵ 0
                    </strong>

                </div>

                <div class="summary-row">

                    <span>
                        Delivery
                    </span>

                    <strong id="delivery">
                        GH₵ 0
                    </strong>

                </div>

                <div class="summary-row total">

                    <span>
                        Total
                    </span>

                    <strong id="total">
                        GH₵ 0
                    </strong>

                </div>


                <a
                    href="checkout.html"
                    class="checkout-btn">

                    Proceed to Checkout →

                </a>


                <a
                    href="products.html"
                    class="continue-shopping">

                    ← Continue Shopping

                </a>

            </aside>

        </div>

    </div>

</main>


<!-- ================= JAVASCRIPT ================= -->

<script>

let cart =
    JSON.parse(
        localStorage.getItem("forgeCart")
    ) || [];


/* PRODUCT EMOJIS */

function getProductEmoji(name) {

    if (
        name.includes("Headphones")
    ) return "🎧";

    if (
        name.includes("Watch")
    ) return "⌚";

    if (
        name.includes("Sneakers")
    ) return "👟";

    if (
        name.includes("Backpack")
    ) return "🎒";

    if (
        name.includes("Lamp")
    ) return "💡";

    if (
        name.includes("Speaker")
    ) return "🔊";

    if (
        name.includes("Hoodie")
    ) return "🧥";

    if (
        name.includes("Sunglasses")
    ) return "🕶️";

    return "🛍️";

}


/* DISPLAY CART */

function renderCart() {

    const cartItems =
        document.getElementById(
            "cart-items"
        );

    const cartLayout =
        document.getElementById(
            "cart-layout"
        );

    const emptyCart =
        document.getElementById(
            "empty-cart"
        );


    if (cart.length === 0) {

        cartLayout.style.display =
            "none";

        emptyCart.style.display =
            "block";

        updateSummary();

        return;

    }


    cartLayout.style.display =
        "grid";

    emptyCart.style.display =
        "none";


    cartItems.innerHTML = "";


    cart.forEach((item, index) => {

        const element =
            document.createElement(
                "div"
            );

        element.className =
            "cart-item";


        element.innerHTML = `

            <div class="cart-item-image">

                ${getProductEmoji(item.name)}

            </div>


            <div class="cart-item-info">

                <h3>
                    ${item.name}
                </h3>

                <span class="cart-item-price">
                    GH₵ ${item.price}
                </span>

            </div>


            <div class="quantity-control">

                <button
                    onclick="changeQuantity(${index}, -1)">

                    −

                </button>

                <span class="quantity-number">
                    ${item.quantity || 1}
                </span>

                <button
                    onclick="changeQuantity(${index}, 1)">

                    +

                </button>

            </div>


            <button
                class="remove-btn"
                onclick="removeItem(${index})">

                🗑️

            </button>

        `;


        cartItems.appendChild(
            element
        );

    });


    updateSummary();

}


/* CHANGE QUANTITY */

function changeQuantity(index, amount) {

    if (!cart[index].quantity) {

        cart[index].quantity = 1;

    }


    cart[index].quantity += amount;


    if (
        cart[index].quantity <= 0
    ) {

        cart.splice(index, 1);

    }


    saveCart();

    renderCart();

}


/* REMOVE */

function removeItem(index) {

    cart.splice(index, 1);

    saveCart();

    renderCart();

}


/* SAVE */

function saveCart() {

    localStorage.setItem(
        "forgeCart",
        JSON.stringify(cart)
    );

}


/* SUMMARY */

function updateSummary() {

    let subtotal = 0;

    cart.forEach(item => {

        subtotal +=
            item.price *
            (item.quantity || 1);

    });


    /*
       Delivery is currently free.
       We can connect your real
       delivery pricing later.
    */

    const delivery = 0;

    const total =
        subtotal + delivery;


    document.getElementById(
        "subtotal"
    ).textContent =
        "GH₵ " + subtotal;


    document.getElementById(
        "delivery"
    ).textContent =
        delivery === 0
            ? "FREE"
            : "GH₵ " + delivery;


    document.getElementById(
        "total"
    ).textContent =
        "GH₵ " + total;


    document.getElementById(
        "header-cart-count"
    ).textContent =
        cart.reduce(
            (sum, item) =>
                sum + (item.quantity || 1),
            0
        );

}


renderCart();

</script>


</body>

</html>
